<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="Full Pokedex">Full Pokédex</title>
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="stylesheet" href="css/styles_main.css"> 
    <link rel="stylesheet" href="css/styles_FullPokedex.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container">
        <h1 data-translate="all_the_pokemons">Tous les Pokémon</h1>

        <div class="type-filter-bar">
            <div id="typeFilters" class="type-filters"></div>
            <div class="type-filter-actions">
                <button type="button" id="resetTypeFilters" class="type-filter-reset" data-translate="reset_filters" hidden>Tout afficher</button>
                <span id="pokedexCount" class="pokedex-count"></span>
            </div>
        </div>

        <p id="noPokemonFound" class="no-results" data-translate="no_pokemon_found" hidden>Aucun Pokémon ne correspond à ces types.</p>

        <div id="pokedexGrid" class="grid-container">
            </div>
    </div>

    <script src="js/PokemonUtils.js"></script>
    <script src="js/LanguageManager.js"></script>
    <script src="js/LoadNavbar.js"></script>
    <script src="js/FullPokedex.js"></script>
</body>
</html>
